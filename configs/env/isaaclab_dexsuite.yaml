##################################################################################
# IsaacLab Dexsuite (Kuka-Allegro Reorient)
##################################################################################
env_type: 'isaaclab'
env_name: 'Isaac-Dexsuite-Kuka-Allegro-Reorient-v0'
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null

# Reward term overrides, e.g. {success: {weight: 10, pos_std: 0.05}, fingers_to_object: {weight: 0.25}}.
reward: null

# Observation overrides, e.g. {policy: {joint_vel: {enabled: false}}}.
observation: null

# Termination overrides, e.g. {object_out_of_bound: {enabled: false}}.
termination: null

# Robot / actuator overrides.
robot:
  init_pos: null
  soft_joint_pos_limit_factor: null
  stiffness_scale: null
  damping_scale: null
  effort_limit_scale: null
  armature_scale: null
  velocity_limit_scale: null
  groups: null

# Action bound.
action_bound:
  type: scalar             # scalar | joint_limit
  fraction: 1.0            # joint_limit only

# Dot-path overrides applied last, e.g. {observations.policy.history_length: 1}.
cfg_overrides: null
