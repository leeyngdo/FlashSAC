##################################################################################
# IsaacLab SimToolReal (Kuka iiwa14 + SHARPA dexterous tool manipulation)
#
# Vendored Direct-workflow task; assets must be fetched first:
#   bash scripts/fetch_simtoolreal_assets.sh
##################################################################################
env_type: 'isaaclab'
env_name: 'Isaac-SimToolReal-Kuka-Sharpa-Direct-v0'
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null

# Flat RewardCfg field overrides, e.g. {keypoint_rew_scale: 100.0, reach_goal_bonus: 500.0}.
reward: null

# Flat ObsCfg field overrides, e.g. {clamp_abs_observations: 5.0}.
observation: null

# Flat TerminationCfg field overrides, e.g. {max_consecutive_successes: 10}.
termination: null

# Not supported for this task; use cfg_overrides instead.
robot: null

# Action bound.
action_bound:
  type: scalar             # joint_limit is unsupported for Direct-workflow tasks
  fraction: 1.0

# Dot-path overrides applied last, e.g.
# {assets.num_assets_per_type: 10, domain_randomization.use_obs_delay: false}.
cfg_overrides: null
